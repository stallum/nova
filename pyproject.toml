[project]
name = "nova"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Artur", email = "arturgab008@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "robyn>=0.88.0",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
nova = "nova.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
